lmcache.integration.behavior=Engine-driven transfer executes GPU gather and scatter in vLLM workers while the LMCache sidecar owns no CUDA context; asynchronous pinned shared-memory stores keep the model thread free of serialization; immutable paged pointer metadata and preallocated transfer slots remove per-group preparation allocations; every valid filesystem-key field has a bounded reversible representation; Python lookup preserves canonical-first compatibility with legacy flat paths; restart inventory fails closed when its bounded root cannot be inspected; startup removes only a replaceable POSIX shared-memory pool before checking capacity and preserves lazy-DRAM and Device-DAX allocations
lmcache.integration.authorship=The Git history preserves the source authors and commit attribution from LMCache pull requests 43, 45, 47, 48, 49, 50, and 51

