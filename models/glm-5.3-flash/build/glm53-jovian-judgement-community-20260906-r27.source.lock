vllm.base.commit.behavior=Allocates loader-owned GLM and KDA parameters through the active checkpoint writer and materializes paired projection inputs before numerical transforms
vllm.base.pull.requests=667,669,672,675
vllm.base.pull.667.behavior=Keeps uniform and padded speculative-decode batches bound to the same graph-owned recurrent metadata buffers
vllm.base.pull.669.behavior=Preserves block-aligned hybrid cache reuse together with exact endpoint checkpoints and truthful external-cache events
vllm.base.pull.672.behavior=Resumes Mamba state using recurrent-cache block units instead of target-cache block units
vllm.base.pull.675.behavior=Materializes a reusable recurrent checkpoint after an exact leading system and developer instruction prefix
vllm.pull.requests=619,573,571,572,665,552,558,553,561,664,599,666,653
vllm.pull.619.behavior=Runs GLM KDA gate projections on a graph-safe auxiliary stream and restores the caller stream before CUDA graph capture
vllm.pull.573.behavior=Applies request-local temperature, top-k, and top-p constraints to the probability distribution sampled by the DFlash proposer
vllm.pull.571.behavior=Reuses normalized constrained probabilities in standard rejection sampling instead of computing a second vocabulary softmax
vllm.pull.572.behavior=Uses the existing FlashInfer sampler feature gate for the probability-returning top-k and top-p operation
vllm.pull.665.behavior=Uses an NVFP4 copy only for the MTP proposal vocabulary projection, retains the BF16 target vocabulary projection, and reuses an already runtime-quantized draft head
vllm.pull.552.behavior=Fuses GLM query scaling and the 1/sqrt(4096) factor into the existing FWHT and FP8 index-head kernel
vllm.pull.558.behavior=Executes the supported DFlash two-tap grouped convolution in one bit-exact Triton kernel and routes broadcast geometries to the generic implementation
vllm.pull.553.behavior=Allows engine-driven external-cache transfers with the expandable-segment allocator after CUDA pointer compatibility validation
vllm.pull.561.behavior=Refreshes DCP-aware fused MTP draft metadata and native draft widths in place
vllm.pull.664.behavior=Shares measured GPU time between prefill and decode, interleaves bounded parallel prefills, and isolates recurrent boundary-logits steps
vllm.pull.599.behavior=Selects direct DCP peer transfers only when every required CUDA peer-access edge is available
vllm.pull.666.behavior=Preserves FP32 SM120 router outputs and stable auxiliary-stream graph-pool addresses
vllm.pull.653.behavior=Uses independent proposal and recovery random streams so speculative rejection preserves the target sampling distribution
vllm.integration.behavior=GLM-5.3 packed FP8 and NVFP4 cache records, memory-weighted hybrid cache allocation, DCP full-cache prefill, production-shaped DCP memory profiling, corrected B12X sparse-MLA cache planning, delegated B12X activation-precision selection, numerically stable FlashKDA prefill, selectable B12X KDA prefill, graph-safe side streams, constrained DFlash sampling, independent speculative random streams, fused FlashInfer probability reuse, NVFP4 MTP proposal projection, fused DFlash grouped convolution, fused FWHT scaling, recurrent request-boundary and leading-instruction reuse, aligned hybrid-cache fallback, measured prefill compute sharing, robust GLM tool parsing, and engine-driven expandable-segment compatibility
vllm.integration.authorship=The Git history preserves commits authored by Luke Alonso, MadeBy561, Giancarlo Delfin, Derek Yates, Thien Tran, logprobz, Apple FCU Fleet, Martin Vit, Codex, and the authors recorded by the merged dev/jovian-judgement history

