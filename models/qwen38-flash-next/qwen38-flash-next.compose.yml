# Select LIL_IMAGE from docs/unified-vllm-docker.md in this repository.
# The image profile owns model, kernel, graph and cache defaults.
name: qwen38-flash-next

x-environment: &environment
  PROFILE: qwen38-flash-next
  HARDWARE_PROFILE: rtx-pro-6000-pcie
  PORT: ${PORT:-8000}
  MODEL: ${MODEL:-local-inference-lab/Qwen3.8-Flash-Next-NVFP4}
  SPECULATOR: ${SPECULATOR:-mtp}
  LANGUAGE_MODEL_ONLY: ${LANGUAGE_MODEL_ONLY:-1}
  VLLM_PLE_CPU_OFFLOAD: ${VLLM_PLE_CPU_OFFLOAD:-1}
  # Match the communication condition of the linked qualification.
  VLLM_PCIE_TWOSHOT_ALLREDUCE_MAX_SIZE: "off"

x-runtime: &runtime
  image: ${LIL_IMAGE:?Set LIL_IMAGE from the shared Docker guide}
  init: true
  network_mode: host
  ipc: host
  restart: unless-stopped
  # Preserve the image entrypoint: it selects the model profile and ABI setup.
  volumes:
    - qwen-model-cache:/root/.cache/huggingface
    - qwen-runtime-cache:/cache
  healthcheck:
    test:
      - CMD
      - /opt/venv/bin/python
      - -c
      - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/health', timeout=4)"
    interval: 30s
    timeout: 5s
    start_period: 10m
    retries: 3

services:
  qwen-tp1:
    <<: *runtime
    profiles: [tp1]
    environment:
      <<: *environment
      TP: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU:-0}"]
              capabilities: [gpu]

  qwen-tp2:
    <<: *runtime
    profiles: [tp2]
    environment:
      <<: *environment
      TP: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0:-0}", "${GPU1:-1}"]
              capabilities: [gpu]

volumes:
  qwen-model-cache:
  qwen-runtime-cache:
